name: Second Workflow

on:
  workflow_run:
    workflows: ["build and test Backend"] # Use the exact 'name:' of your first workflow
    types:
      - completed

jobs:
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }} # Only run if the first one passed
    steps:
      - run: echo "The first workflow passed, running downstream tasks..."
