name: build and test Backend

on: 
     pull_request:

jobs:
  
  compliance:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

  produce-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        color: ["ABC2"]
    steps:
      - id: str1
        env:
          color: ${{ matrix.color }}
        run: |
          echo ${{ github.GITHUB_EVENT_NAME }}
          echo "$color" 
          echo "color=${color}" >> "$GITHUB_OUTPUT"
      - name: a
        run: |
          echo $color
          echo "Aus Output: ${{ steps.str1.outputs.color }}"
