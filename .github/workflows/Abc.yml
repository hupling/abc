name: build and test Backend

on: [push]
jobs:
  doc:
    runs-on: ubuntu-latest

    permissions:
      # Required to push changes!
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: bitflight-devops/github-action-readme-generator@v1
      with:
        action: ./action.yml
        readme: abc.md
    - run: |
        cat abc.md
        
