name: build and test Backend

on: [pull_request]

jobs:
  
  compliance:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

  produce-artifacts:
    runs-on: ubuntu-latest

  
    steps:
      - name: Show the PR Title
        run: echo "The title is ${{ github.event.pull_request.title }}"
